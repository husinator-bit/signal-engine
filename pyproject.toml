[project]
name = "signal-engine"
version = "0.1.0"
description = "AI Industry Intelligence Engine — discovery of hidden champions in AI infrastructure"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "modal>=0.65.0",
    "notion-client>=2.2.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "resend>=2.0.0",
    "sec-api>=1.0.0",
    "sqlmodel>=0.0.22",
    "tenacity>=9.0.0",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "ty>=0.0.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signal_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
